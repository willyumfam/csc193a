<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Fancify My Text</title>
    <script src="fancifymytext.js"></script>
  </head>
  <body>
    <h1>Fancify My Text</h1>

    <!-- Text input fieldset -->
    <fieldset>
      <legend>Text</legend>
      <textarea id="myText" rows="4" cols="30"></textarea>
    </fieldset>

    <!-- Fancify controls fieldset -->
    <fieldset>
      <legend>Fancify</legend>

      <button onclick="makeBigger()">Bigger!</button>
      <button onclick="mooify()">Moo</button>

      <br /><br />

      <input
        type="radio"
        id="fancyShmancy"
        name="style"
        onchange="applyStyle()"
      />
      <label for="fancyShmancy">FancyShmancy</label>

      <input
        type="radio"
        id="boringBetty"
        name="style"
        onchange="applyStyle()"
      />
      <label for="boringBetty">BoringBetty</label>
    </fieldset>
  </body>
</html>
